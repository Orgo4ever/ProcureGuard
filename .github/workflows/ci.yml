name: ProcureGuard quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ProcureGuard
        run: python -m pip install -e .
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic quality scan
        run: python -m procureguard --input data/synthetic --output build
      - name: Verify expected sample metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/summary.json").read_text(encoding="utf-8"))
          assert report["rows_scanned"] == 38, report
          assert report["issues_found"] == 22, report
          assert report["distinct_rows_with_issues"] == 22, report
          assert report["row_pass_rate_pct"] == 42.11, report
          PY
      - name: Demonstrate audited issue closure on copied fictional records
        run: python scripts/demo_lifecycle.py --output build/lifecycle_demo
      - name: Validate complete case lifecycle evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("build/lifecycle_demo/demo_lifecycle.json").read_text())
          assert result["before_scan"]["cases_created"] == 22, result
          assert result["initial_verification"]["verified"] is False, result
          assert result["post_correction_verification"]["verified"] is True, result
          assert result["case_register"]["cases_by_status"]["Resolved"] == 1, result
          assert "verification_failed" in result["audit_event_actions"], result
          assert "verified_resolved" in result["audit_event_actions"], result
          PY
      - name: Publish synthetic scan and audited lifecycle reports
        uses: actions/upload-artifact@v4
        with:
          name: procureguard-synthetic-quality-report
          path: |
            build/issues.csv
            build/summary.json
            build/lifecycle_demo/cases.csv
            build/lifecycle_demo/audit_events.csv
            build/lifecycle_demo/case_summary.json
            build/lifecycle_demo/demo_lifecycle.json
